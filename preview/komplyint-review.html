<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Komplyint Oy - Website redesign review</title><style>
/* Komplyint digital services design system - scoped to kc-* components */
.kc-root{--kc-bg:#fff;--kc-surface:#f5f8f8;--kc-ink:#132b35;--kc-muted:#52666d;--kc-border:#dce6e6;--kc-teal:#076f69;--kc-deep:#082c35;--kc-accent:#c4eeea;--kc-white:#fff;background:var(--kc-bg);color:var(--kc-ink);font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.65;overflow:hidden}
.dark .kc-root{--kc-bg:#0b1820;--kc-surface:#11252d;--kc-ink:#e8f4f3;--kc-muted:#b4c9c9;--kc-border:#2e4449;--kc-teal:#5bd6ca;--kc-deep:#081b21;--kc-accent:#5bd6ca}
.kc-root *{box-sizing:border-box}
.kc-root h1,.kc-root h2,.kc-root h3,.kc-root h4{margin:0;font-weight:650;letter-spacing:-.035em;line-height:1.13;color:inherit}
.kc-root a{color:inherit;text-decoration:none}
.kc-root button,.kc-root input,.kc-root select,.kc-root textarea{font:inherit}
.kc-root button{cursor:pointer}
.kc-root :focus-visible{outline:3px solid #25c0b1;outline-offset:4px}
.kc-shell{width:min(1240px,calc(100% - 96px));margin:auto;position:relative}
.kc-skip{position:absolute;z-index:999;top:-80px;left:24px;background:#fff;padding:10px 16px}
.kc-skip:focus{top:8px}
.kc-topbar{background:#09262e;color:#daebe9;height:32px;font-size:10px;letter-spacing:.13em;font-weight:650}
.kc-topbar-inner{display:flex;align-items:center;justify-content:space-between;height:100%;gap:24px}
.kc-small-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#4bd3c5;margin-right:7px}
.kc-header{position:sticky;top:0;z-index:100;background:var(--kc-bg);border-bottom:1px solid var(--kc-border);backdrop-filter:blur(18px)}
.kc-header-row{display:flex;align-items:center;gap:30px;min-height:92px}
.kc-logo-link{display:flex;align-items:center;flex-shrink:0;min-width:184px}
.kc-logo{display:block;width:174px;height:60px;object-fit:contain;object-position:left center}
.kc-nav{display:flex;align-items:center;justify-content:center;gap:30px;margin-left:auto}
.kc-nav a{font-size:13px;font-weight:650;white-space:nowrap;color:var(--kc-muted);position:relative;padding:18px 0}
.kc-nav a:hover,.kc-nav a.is-current{color:var(--kc-teal)}

.kc-actions{display:flex;align-items:center;gap:13px;margin-left:auto}
.kc-language,.kc-theme{font-weight:700;font-size:12px;border:1px solid var(--kc-border);background:transparent;color:var(--kc-ink);height:39px;width:43px;display:grid;place-items:center;border-radius:4px}
.kc-language:hover,.kc-theme:hover{background:var(--kc-surface)}
.kc-header-cta{display:flex;align-items:center;gap:19px;padding:13px 18px;background:var(--kc-teal);color:#fff!important;font-size:12px;font-weight:700;white-space:nowrap;border-radius:4px}
.dark .kc-header-cta{color:#062a2b!important}
.kc-header-cta:hover,.kc-button-primary:hover{filter:brightness(1.12)}
.kc-arrow{display:inline-block;font-family:Arial,sans-serif;font-size:18px;line-height:1;font-weight:500;transition:transform .2s}
a:hover .kc-arrow{transform:translate(3px,-3px)}
.kc-arrow.light{color:#fff}
.kc-mobile-toggle{display:none;border:0;background:transparent;padding:12px}
.kc-mobile-toggle span{display:block;width:24px;height:2px;background:var(--kc-ink);margin:4px 0}
.kc-hero{padding:0;position:relative;min-height:660px;display:flex;align-items:stretch;overflow:hidden;background:#0a2930;color:#fff}
.kc-hero-poster,.kc-hero-video,.kc-hero-shade{position:absolute;inset:0;width:100%;height:100%}
.kc-hero-poster{background:url('https://raw.githubusercontent.com/komplyint/komplyint-website/main/frontend/public/media/hero.webp') center/cover no-repeat;z-index:0}
.kc-hero-video{object-fit:cover;z-index:1;display:block}
.kc-hero-shade{background:linear-gradient(90deg,rgba(3,24,31,.91) 0%,rgba(3,24,31,.75) 44%,rgba(3,24,31,.43) 100%),linear-gradient(0deg,rgba(3,24,31,.30),transparent 45%);z-index:2}
.kc-hero-layout{z-index:3;display:grid;grid-template-columns:minmax(0,1fr) 205px;gap:60px;align-items:center;padding:120px 0 130px}
.kc-hero-copy{max-width:770px}
.kc-hero-tag,.kc-eyebrow{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
.kc-hero-tag{color:#80dfd4;margin:0 0 27px}
.kc-hero h1{font-size:clamp(46px,5.1vw,76px);letter-spacing:-.058em;line-height:1.06;max-width:840px;color:#fff}
.kc-hero-lead{font-size:18px;line-height:1.78;max-width:590px;color:#e2e9e9;margin:27px 0 30px}
.kc-hero-buttons{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

.kc-button:hover{transform:translateY(-2px)}
.kc-button-primary{background:#0f8c81;color:#fff!important}
.kc-button-ghost{border:1px solid rgba(255,255,255,.55);color:#fff!important;background:rgba(3,24,31,.18)}
.kc-button-ghost:hover{background:rgba(255,255,255,.13)}
.kc-hero-side{border-left:1px solid rgba(255,255,255,.40);padding-left:27px;display:flex;flex-direction:column;gap:16px;margin-top:44px}
.kc-side-marker{font-size:35px;line-height:1.2;color:#a3e4db;letter-spacing:-.04em;margin-bottom:12px}
.kc-hero-side-label{color:#91c9c5;font-size:9px;letter-spacing:.14em;font-weight:750}
.kc-hero-side>span{font-size:13px;padding-bottom:13px;border-bottom:1px solid rgba(255,255,255,.22)}
.kc-hero-edge{position:absolute;bottom:0;z-index:3;height:7px;background:linear-gradient(90deg,#0d998e 0%,#65d2bf 38%,transparent 92%);width:100%}
.kc-section{padding:112px 0}
.kc-section-intro{padding-bottom:100px}
.kc-intro{max-width:850px;margin-bottom:42px}
.kc-eyebrow{color:var(--kc-teal);margin:0 0 19px}
.kc-intro h2,.kc-about h2,.kc-cta h2,.kc-product h2{font-size:clamp(31px,3.3vw,49px);line-height:1.18;letter-spacing:-.045em}

.kc-moreline{border-top:1px solid var(--kc-border);margin-top:30px;padding-top:20px;display:flex;justify-content:space-between;align-items:center;gap:20px;font-size:13px;color:var(--kc-muted)}

.kc-muted-section{background:var(--kc-surface)}
.kc-explorer{display:grid;grid-template-columns:330px minmax(0,1fr);align-items:stretch;border:1px solid var(--kc-border);background:var(--kc-bg);box-shadow:0 14px 42px rgba(9,43,48,.035)}
.kc-explorer-tabs{padding:15px;background:var(--kc-surface);border-right:1px solid var(--kc-border);display:flex;flex-direction:column;gap:6px}
.kc-explorer-tab{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:3px;color:var(--kc-ink);padding:16px 13px;min-height:71px;transition:background .2s,border .2s}

        <a href="#home">${t.navigation.home}</a><a href="#services">${t.navigation.services}</a><a href="#software">${t.navigation.software}</a><a href="#contact">${t.navigation.contact}</a>
      </nav>
      <div class="kc-actions"><button id="toggle-language" class="kc-language" aria-label="${lang==='fi'?'Switch to English':'Vaihda suomeksi'}">${lang==='fi'?'EN':'FI'}</button>
      <button id="toggle-theme" class="kc-theme" aria-label="Toggle theme">◐</button><a href="#contact" class="kc-header-cta">${t.contactButton}${arrow}</a>
      <button class="kc-mobile-toggle" id="toggle-menu" aria-label="${t.navigation.menu}" aria-expanded="false"><span></span><span></span><span></span></button></div></div></header>
    <main id="main-content">
      <section class="kc-hero" id="home"><div class="kc-hero-poster"></div><video class="kc-hero-video" id="hero-video" autoplay muted loop playsinline preload="auto" poster="https://raw.githubusercontent.com/komplyint/komplyint-website/main/frontend/public/media/hero.webp" aria-hidden="true"><source src="https://raw.githubusercontent.com/komplyint/komplyint-website/main/frontend/public/media/hero.mp4" type="video/mp4"></video><div class="kc-hero-shade"></div>
        <div class="kc-shell kc-hero-layout"><div class="kc-hero-copy"><p class="kc-hero-tag">${t.hero.label}</p><h1>${t.hero.title}</h1><p class="kc-hero-lead">${t.hero.text}</p><div class="kc-hero-buttons"><a class="kc-button kc-button-primary" href="#contact">${t.contactButton}${arrow}</a><a class="kc-button kc-button-ghost" href="#services">${t.explore}<span>↓</span></a></div></div>
        <div class="kc-hero-side"><div class="kc-side-marker">K / 01</div><div class="kc-hero-side-label">${lang==='fi'?'TYÖN PERIAATTEET':'DELIVERY PRINCIPLES'}</div><span>${t.hero.point1}</span><span>${t.hero.point2}</span><span>${t.hero.point3}</span></div></div><div class="kc-hero-edge"></div></section>
      <section class="kc-section kc-section-intro" id="services"><div class="kc-shell">${intro(t.intro)}
        <div class="kc-service-grid">${sv.slice(0,4).map((s,i)=>`<a class="kc-service-tile" href="#service-explorer"><div class="kc-tile-top"><span>${String(i+1).padStart(2,'0')}</span>${arrow}</div><h3>${s.title}</h3><p>${s.intro}</p></a>`).join('')}</div>
        <div class="kc-moreline"><span>${lang==='fi'?'Lisäksi: ohjelmistotestaus, laadunvarmistus ja digitaalinen toimistotuki.':'Also available: software testing, quality assurance and digital office support.'}</span><a href="#service-explorer">${t.explore} ${arrow}</a></div></div></section>
      <section class="kc-section kc-muted-section" id="service-explorer"><div class="kc-shell">${intro(t.area)}<div class="kc-explorer">
        <div class="kc-explorer-tabs" role="tablist" aria-label="${t.area.title}">${sv.map((s,i)=>`<button class="kc-explorer-tab ${selected===i?'active':''}" type="button" role="tab" aria-selected="${selected===i}" data-service="${i}"><span>${String(i+1).padStart(2,'0')}</span><strong>${s.title}</strong><b>↗</b></button>`).join('')}</div>
        <div id="service-detail" class="kc-detail" role="tabpanel">${detailMarkup()}</div></div></div></section>
      <section class="kc-section kc-examples"><div class="kc-shell">${intro({eyebrow:t.impact.eyebrow,title:t.impact.title,text:t.impact.disclaimer})}
        <div class="kc-example-grid">${t.impact.cases.map(c=>`<article class="kc-example"><span class="kc-example-num">${c.num}</span><h3>${c.title}</h3><div class="kc-example-line"><span>${lang==='fi'?'LÄHTÖTILANNE':'BEFORE'}</span><p>${c.before}</p></div><div class="kc-example-line"><span>${lang==='fi'?'TAVOITE':'AFTER'}</span><p>${c.after}</p></div></article>`).join('')}</div></div></section>
      <section class="kc-section kc-process"><div class="kc-shell">${intro({eyebrow:t.process.eyebrow,title:t.process.title})}<div class="kc-steps">${t.process.steps.map((s,i)=>`<div class="kc-step"><div class="kc-step-no">${String(i+1).padStart(2,'0')}</div><h3>${s.title}</h3><p>${s.body}</p></div>`).join('')}</div></div></section>
      <section class="kc-section kc-muted-section"><div class="kc-shell kc-values">${intro({eyebrow:t.trust.eyebrow,title:t.trust.title})}<div class="kc-values-grid">${t.trust.items.map((s,i)=>`<div class="kc-value"><span>0${i+1}</span><div><h3>${s.title}</h3><p>${s.body}</p></div></div>`).join('')}</div></div></section>
      <section class="kc-section kc-about"><div class="kc-shell kc-about-layout"><div><p class="kc-eyebrow">${lang==='fi'?'YRITYKSESTÄ':'ABOUT OUR COMPANY'}</p><h2>${t.about.title}</h2></div><p>${t.about.text}</p></div></section>
      <section class="kc-section kc-muted-section" id="software"><div class="kc-shell">${intro({eyebrow:t.software.eyebrow,title:t.software.title,text:t.software.lead})}<div class="kc-software-grid">${t.software.items.map((s,i)=>`<article class="kc-software-card"><span>${String(i+1).padStart(2,'0')}</span><h2>${s.title}</h2><p>${s.body}</p></article>`).join('')}</div><div class="kc-limit"><h3>${t.software.limitTitle}</h3><p>${t.software.limit}</p></div><div class="kc-product" style="margin-top:50px"><div><h2>${t.software.productTitle}</h2><p>${t.software.productText}</p></div><a class="kc-text-link" href="https://floently.com/learn" rel="noopener noreferrer" target="_blank">${t.software.productLink}${arrow}</a></div></div></section>
      <section class="kc-cta"><div class="kc-shell kc-cta-inner"><div><p class="kc-eyebrow">${t.cta.eyebrow}</p><h2>${t.cta.title}</h2><p>${t.cta.text}</p></div><a class="kc-button kc-button-light" href="#contact">${t.cta.button}${arrow}</a></div></section>
      <section class="kc-section" id="contact"><div class="kc-shell">${intro({eyebrow:t.contactPage.eyebrow,title:t.contactPage.title,text:t.contactPage.lead})}<div class="kc-contact-grid">
        <div class="kc-contact-side"><p class="kc-eyebrow">${t.contactPage.action}</p><h2>Komplyint Oy</h2><p>${t.footer}</p><p>Finland · EU</p><a class="kc-text-link" href="mailto:gliavex@gliavex.fi">gliavex@gliavex.fi${arrow}</a><div class="kc-contact-note">${t.contactPage.note}</div></div>
        <form class="kc-form" id="contact-form"><div class="kc-form-two"><label>${t.contactPage.formName}<input type="text" name="name" maxlength="120" autocomplete="name"></label><label>${t.contactPage.formEmail}<input type="email" name="email" required maxlength="200" autocomplete="email" placeholder="name@company.fi"></label></div><label>${t.contactPage.formService}<select name="topic"><option value="">${t.contactPage.select}</option>${sv.map(s=>`<option value="${s.title}">${s.title}</option>`).join('')}<option value="Other">${t.contactPage.other}</option></select></label><label>${t.contactPage.formMessage}<textarea name="message" rows="6" required maxlength="4500"></textarea></label>
        <label class="kc-honeypot">Website<input name="website" tabindex="-1" autocomplete="off"></label><p class="kc-form-privacy">${t.contactPage.privacy} <a href="#privacy">${t.navigation.privacy}</a></p><div id="contact-status" role="status"></div><button type="submit" class="kc-button kc-button-primary">${t.contactPage.send}${arrow}</button></form></div></div></section>
      <section class="kc-section kc-muted-section" id="privacy"><div class="kc-shell"><div class="kc-intro"><p class="kc-eyebrow">${t.privacyPage.eyebrow}</p><h2>${t.privacyPage.title}</h2><p class="kc-lead">${t.privacyPage.lead}</p></div><div class="kc-privacy-list">${t.privacyPage.sections.map((s,i)=>`<article><span>${String(i+1).padStart(2,'0')}</span><div><h2>${s.title}</h2><p>${s.body}</p></div></article>`).join('')}</div></div></section>
    </main><footer class="kc-footer"><div class="kc-shell kc-footer-top"><div class="kc-footer-brand"><img src="https://raw.githubusercontent.com/komplyint/komplyint-website/main/frontend/public/logo.svg" alt="Komplyint Oy"><p>${t.about.text}</p></div><div class="kc-footer-links"><strong>${lang==='fi'?'Sivusto':'Explore'}</strong><a href="#home">${t.navigation.home}</a><a href="#services">${t.navigation.services}</a><a href="#software">${t.navigation.software}</a><a href="#contact">${t.navigation.contact}</a><a href="#privacy">${t.navigation.privacy}</a></div><div class="kc-footer-links"><strong>${lang==='fi'?'Yhteys':'Contact'}</strong><a href="mailto:gliavex@gliavex.fi">gliavex@gliavex.fi</a><span>Finland · EU</span></div></div><div class="kc-shell kc-footer-bottom"><span>© 2026 ${t.footer}</span><span>${t.footerNote}</span></div></footer>`;
    document.getElementById('toggle-language').onclick=()=>{lang=lang==='fi'?'en':'fi';selected=0;localStorage.setItem('komplyint-lang',lang);render()};
    document.getElementById('toggle-theme').onclick=()=>{const n=!document.documentElement.classList.contains('dark');document.documentElement.classList.toggle('dark',n);localStorage.setItem('komplyint-theme',n?'dark':'light')};
    document.getElementById('toggle-menu').onclick=()=>{const el=document.getElementById('static-nav');el.classList.toggle('is-open');document.getElementById('toggle-menu').setAttribute('aria-expanded',el.classList.contains('is-open')?'true':'false')};
    document.querySelectorAll('[data-service]').forEach(el=>el.addEventListener('click',()=>{selected=Number(el.getAttribute('data-service'));document.getElementById('service-detail').innerHTML=detailMarkup();document.querySelectorAll('[data-service]').forEach(b=>{const a=Number(b.getAttribute('data-service'))===selected;b.classList.toggle('active',a);b.setAttribute('aria-selected',a?'true':'false')})}));
    document.getElementById('contact-form').onsubmit=async event=>{
      event.preventDefault();const form=event.currentTarget, f=new FormData(form), status=document.getElementById('contact-status'), btn=form.querySelector('button[type=submit]');
      if(f.get('website'))return;
      btn.disabled=true;btn.textContent=t.contactPage.sending;status.textContent='';
      try {
        const message=(f.get('topic')?'Topic: '+f.get('topic')+'\n\n':'')+(f.get('message')||'');
        const response=await fetch('/api/contact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:f.get('name'),email:f.get('email'),message})});
        if(!response.ok)throw Error('send');
        status.className='kc-form-success';status.textContent=t.contactPage.sent;form.reset();
      } catch(e){status.className='kc-form-error';status.textContent=t.contactPage.fail+' gliavex@gliavex.fi'}
      finally{btn.disabled=false;btn.textContent=t.contactPage.send}
    };
    try{document.getElementById('hero-video').play().catch(()=>{})}catch(e){}
  }
  render();
})();

document.getElementById('contact-form')?.addEventListener('submit',function(e){e.preventDefault();e.stopImmediatePropagation();alert('Review preview only. Please contact gliavex@gliavex.fi directly.');},true);
</script></body></html>
