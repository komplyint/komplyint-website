name: Deploy Komplyint production to existing Vercel project
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: komplyint-production
  cancel-in-progress: false
jobs:
  credential-preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.readiness.outputs.ready }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Report integration readiness without exposing credentials
        id: readiness
        shell: bash
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::warning::Vercel production deployment is blocked until repository secret $name is configured."
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then echo "Vercel CLI credentials available."; echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "## Production deploy BLOCKED: Vercel authorization missing" >> "$GITHUB_STEP_SUMMARY"; echo "Either reconnect the existing Vercel project to the main branch or configure the three repository secrets. No new Vercel project is needed." >> "$GITHUB_STEP_SUMMARY"; fi
  production:
    needs: credential-preflight
    if: github.event_name != 'pull_request' && needs.credential-preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify existing Vercel project credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Vercel project authorization missing::Set $name in repository Settings / Secrets and variables / Actions, or reconnect the existing Vercel project to GitHub main."
              exit 1
            fi
          done
          echo "Existing Vercel project credentials available."
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Load existing project's production settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build production from verified main
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy prebuilt artifact to existing production project
        run: |
          set -euo pipefail
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --env "KOMPLYINT_DEPLOY_COMMIT=${GITHUB_SHA}" > /tmp/komplyint-vercel-deployment-url.txt
          echo "Vercel production deployment submitted."
          echo "Deployment URL: $(cat /tmp/komplyint-vercel-deployment-url.txt)" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify live handbook design and brochure delivery
        env:
          PUBLIC_SITE_URL: https://www.komplyint.fi
          RELEASE_VERIFY_ATTEMPTS: 10
        run: node scripts/verify-public-release.mjs
      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: komplyint-vercel-publication-evidence
          path: |
            release-evidence.json
            /tmp/komplyint-vercel-deployment-url.txt
          if-no-files-found: ignore
