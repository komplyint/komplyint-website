name: Generate small poster from preserved hero image
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Generate optimized mobile poster from protected original
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          ffmpeg -hide_banner -loglevel error -y -i public/media/hero.webp -vf 'scale=800:-2' -frames:v 1 -c:v libwebp -quality 65 -compression_level 5 public/media/hero-mobile.webp
          ffprobe -v error -show_entries stream=codec_name,width,height -show_entries format=size -of json public/media/hero-mobile.webp
          test "$(stat -c%s public/media/hero-mobile.webp)" -gt 1000
          test "$(stat -c%s public/media/hero-mobile.webp)" -le 150000
          ls -lh public/media/hero.webp public/media/hero-mobile.webp
      - name: Commit derivative, leave protected source unchanged
        shell: bash
        run: |
          git config user.name 'komplyint-delivery[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/media/hero-mobile.webp
          if ! git diff --cached --quiet; then
            git commit -m 'asset(hero): add responsive mobile WebP derivative of original poster'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
