name: Komplyint public production release verification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: komplyint-public-domain-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify actual public handbook release (not merely a CI build)
        env:
          PUBLIC_SITE_URL: https://www.komplyint.fi
          RELEASE_VERIFY_ATTEMPTS: 6
        run: node scripts/verify-public-release.mjs
      - name: Keep real domain evidence even when a hosting connection is blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: komplyint-public-release-evidence
          path: release-evidence.json
          if-no-files-found: ignore
