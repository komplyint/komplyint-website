name: Komplyint live deployment inspection
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
  deployments: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Inspect live DNS and public pages
        shell: bash
        run: |
          set +e
          for domain in komplyint.fi www.komplyint.fi komplyint-website.vercel.app; do
            echo "== Public DNS: $domain =="
            dig +short "$domain" A | head -n 8
            dig +short "$domain" CNAME | head -n 4
            echo "== HTTPS: $domain =="
            curl -sSIL --max-time 16 "https://$domain/" | grep -iE '^(HTTP/|location:|server:|x-vercel-id:|x-powered-by:|age:)' | head -n 14
            echo "== Page content: $domain =="
            curl -sSL --max-time 18 "https://$domain/" | grep -Eoi 'Teknologiaa, joka helpottaa oikeaa työtä|Compliance readiness|Vaatimustenmukaisuusvalmistautuminen|Technology that makes real work easier|Käytännöllisiä digiratkaisuja' | head -n 5 || true
          done
      - name: Inspect GitHub deployments and configured deploy integration
        env:
          GH_TOKEN: \${{ github.token }}
          VERCEL_TOKEN_AVAILABLE: \${{ secrets.VERCEL_TOKEN != '' }}
          VERCEL_ORG_AVAILABLE: \${{ secrets.VERCEL_ORG_ID != '' }}
          VERCEL_PROJECT_AVAILABLE: \${{ secrets.VERCEL_PROJECT_ID != '' }}
        shell: bash
        run: |
          echo "Vercel token configured in repository: $VERCEL_TOKEN_AVAILABLE"
          echo "Vercel org ID configured in repository: $VERCEL_ORG_AVAILABLE"
          echo "Vercel project ID configured in repository: $VERCEL_PROJECT_AVAILABLE"
          echo 'GitHub Pages:'
          curl -sS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -w "\\nHTTP_STATUS=%{http_code}\\n" "https://api.github.com/repos/komplyint/komplyint-website/pages" | head -c 2000 || true
          echo
          echo 'Public Pages URL:'
          curl -sSIL --max-time 12 "https://komplyint.github.io/komplyint-website/" | grep -Ei '^(HTTP/|location:|server:)' | head -n 6 || true
          echo 'GitHub Deployments:'
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/komplyint/komplyint-website/deployments?per_page=7" | \
            python3 -c 'import sys,json; a=json.load(sys.stdin); print(json.dumps([{"environment":x.get("environment"),"ref":x.get("ref"),"sha":x.get("sha"),"created_at":x.get("created_at"),"id":x.get("id")} for x in a],indent=2))' || true
