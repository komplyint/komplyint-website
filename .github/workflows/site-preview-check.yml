name: Komplyint handbook and awards-oriented quality checks
on:
  push:
    branches:
      - main
      - feature/digital-services-redesign-20261025
      - feature/handbook-quiet-precision-20261025
      - feature/handbook-media-parity-release-20261025
  pull_request:
    branches:
      - main
concurrency:
  group: komplyint-site-qa-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate legacy JavaScript
        run: |
          node --check frontend/src/modern.js
          node --check frontend/server.js
          node --check backend/app/main.js
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test public routes and build production Next.js
        run: npm run build

      - name: Inspect preserved original film
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          file public/media/hero.mp4
          ffprobe -v error -show_entries format=duration,size,format_name -show_entries stream=codec_name,codec_type,width,height,pix_fmt -of json public/media/hero.mp4
      - name: Install Chromium and visual test harness
        run: |
          npm install --no-save playwright @axe-core/playwright --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser smoke tests with screenshots
        run: |
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          HOSTNAME=127.0.0.1 PORT=3000 node .next/standalone/server.js > /tmp/komplyint-website.log 2>&1 &
          for i in $(seq 1 40); do if curl -fsS http://127.0.0.1:3000/ > /dev/null; then break; fi; sleep 2; done
          node tests/visual.smoke.mjs
          node tests/language-font.contract.mjs
          node tests/service-keyboard.contract.mjs
          node tests/theme-preference.contract.mjs
          node tests/contact-flow.contract.mjs
          node tests/hero-media.contract.mjs
          node tests/layout-shift.diagnostics.mjs
          node tests/award-audit.mjs
      - name: Attach review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: komplyint-site-review-screenshots
          path: site-preview/
          if-no-files-found: ignore
