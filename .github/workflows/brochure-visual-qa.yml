name: Verify public service brochures visually
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Set up isolated PDF rendering dependency
        shell: bash
        run: |
          python3 -m venv /tmp/komplyint-pdf-qa
          /tmp/komplyint-pdf-qa/bin/python -m pip install --disable-pip-version-check --quiet 'PyMuPDF>=1.24,<2'
      - name: Validate PDF and ZIP bytes and render all 18 pages
        shell: bash
        run: |
          /tmp/komplyint-pdf-qa/bin/python scripts/verify_public_brochures.py
      - name: Upload all rendered brochure pages
        uses: actions/upload-artifact@v4
        with:
          name: komplyint-brochure-visual-review
          path: document-preview/
