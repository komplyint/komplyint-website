name: Verify public service brochures visually
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate public download formats and render page previews
        shell: bash
        run: |
          command -v pdfinfo >/dev/null && command -v pdftoppm >/dev/null && command -v unzip >/dev/null
          mkdir -p document-preview
          for name in Komplyint_Palveluesite_FI Komplyint_Service_Portfolio_EN Komplyint_Tjanstebroschyr_SV; do
            pdfinfo "public/downloads/$name.pdf" | grep -E 'Pages:|Page size:|File size:'
            pdftoppm -png -scale-to 950 "public/downloads/$name.pdf" "document-preview/$name" >/dev/null
            test "$(pdfinfo "public/downloads/$name.pdf" | awk '/^Pages:/ {print $2}')" = "6"
          done
          unzip -t "public/downloads/Komplyint_Service_Documents.zip"
          find document-preview -type f -name '*.png' | sort
      - name: Upload all rendered brochure pages
        uses: actions/upload-artifact@v4
        with:
          name: komplyint-brochure-visual-review
          path: document-preview/
