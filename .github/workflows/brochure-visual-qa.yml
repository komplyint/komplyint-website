name: Verify public service brochures visually
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up isolated PDF rendering dependency
        shell: bash
        run: |
          python3 -m venv /tmp/komplyint-pdf-qa
          /tmp/komplyint-pdf-qa/bin/python -m pip install --disable-pip-version-check --quiet 'PyMuPDF>=1.24,<2' reportlab pypdf
      - name: Generate the proposed FI EN SV brochures from this PR website copy
        shell: bash
        run: |
          npm install --no-audit --no-fund
          node scripts/export-public-portfolio.mjs
          /tmp/komplyint-pdf-qa/bin/python scripts/generate_public_portfolio.py
          /tmp/komplyint-pdf-qa/bin/python scripts/verify_portfolio_copy.py
      - name: Validate PDF and ZIP bytes and render all 30 pages
        shell: bash
        run: |
          /tmp/komplyint-pdf-qa/bin/python scripts/verify_public_brochures.py
      - name: Sync validated brochure files to the approved review branch
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/business-operations-20261031' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feature/business-operations-20261031"
          git config user.name 'komplyint-delivery[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/downloads/Komplyint_Palveluesite_FI.pdf public/downloads/Komplyint_Service_Portfolio_EN.pdf public/downloads/Komplyint_Tjanstebroschyr_SV.pdf public/downloads/Komplyint_Service_Documents.zip
          if git diff --cached --quiet; then
            echo 'Brochures on review branch already match verified sources.'
          else
            git commit -m 'asset(review): sync verified 10-page FI EN SV business brochure PDFs and ZIP'
            git push origin HEAD:feature/business-operations-20261031
          fi
      - name: Upload all rendered brochure pages
        uses: actions/upload-artifact@v4
        with:
          name: komplyint-brochure-visual-review
          path: |
            document-preview/
            public/downloads/Komplyint_Palveluesite_FI.pdf
            public/downloads/Komplyint_Service_Portfolio_EN.pdf
            public/downloads/Komplyint_Tjanstebroschyr_SV.pdf
            public/downloads/Komplyint_Service_Documents.zip
