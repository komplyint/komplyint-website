name: Build reviewed FI/EN/SV service PDFs and ZIP
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/lib/commercial.ts
      - src/lib/i18n-sv.ts
      - src/lib/i18n-ui.ts
      - src/lib/i18n.ts
      - scripts/export-public-portfolio.mjs
      - scripts/generate_public_portfolio.py
      - scripts/verify_public_brochures.py
      - scripts/verify_portfolio_copy.py
      - .github/workflows/build-public-brochures.yml
permissions:
  contents: write
concurrency:
  group: komplyint-published-brochures
  cancel-in-progress: false
jobs:
  brochures:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export canonical website copy and reuse the eight-page renderer
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node scripts/export-public-portfolio.mjs
          python -m pip install --disable-pip-version-check --quiet reportlab pypdf pymupdf
          python scripts/generate_public_portfolio.py
      - name: Verify PDF copy parity, ZIP bytes and all 24 rendered pages
        run: |
          set -euo pipefail
          python scripts/verify_public_brochures.py
          python scripts/verify_portfolio_copy.py
          cp .cache/public-portfolio.json document-preview/website-copy-snapshot.json
          git rev-parse HEAD > document-preview/source-commit.txt
      - name: Publish verified documents without overwriting concurrent work
        run: |
          set -euo pipefail
          git config user.name 'komplyint-delivery[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::main changed during generation. Rerun the job against the latest source; never force-push stale brochures."
            exit 1
          fi
          git add public/downloads/
          if git diff --cached --quiet; then
            echo "Public brochures already match the website copy."
          else
            git commit -m 'asset(downloads): synchronize FI EN SV brochures with canonical website copy'
            git push origin HEAD:main
            echo "Verified brochures committed. Live-domain publication remains separately verified." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload generated PDFs, copy evidence and 24 page renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: komplyint-trilingual-brochure-visual-review
          path: |
            document-preview/
            public/downloads/*.pdf
            public/downloads/Komplyint_Service_Documents.zip
          if-no-files-found: ignore
