name: Generate protected film mobile delivery derivative
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mobile-transcode:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Produce same original film in mobile-friendly H264
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          ffmpeg -y -hide_banner -loglevel error -i public/media/hero.mp4 -an -vf 'scale=854:-2' -c:v libx264 -preset medium -crf 27 -pix_fmt yuv420p -movflags +faststart public/media/hero-mobile.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of json public/media/hero-mobile.mp4
          test "$(stat -c%s public/media/hero-mobile.mp4)" -le 2000000
          ls -lh public/media/hero.mp4 public/media/hero-optimized.mp4 public/media/hero-mobile.mp4
      - name: Commit derived film without modifying protected master
        run: |
          git config user.name 'komplyint-delivery[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/media/hero-mobile.mp4
          if ! git diff --cached --quiet; then
            git commit -m 'asset(media): publish verified sub-2MB mobile encode of protected hero film'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
