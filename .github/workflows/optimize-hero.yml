name: Optimize protected hero film into web delivery derivative
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/optimize-hero.yml'
      - 'public/media/hero.mp4'
permissions:
  contents: write
jobs:
  transcode:
    if: github.head_ref == 'feature/handbook-quiet-precision-20261025'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Generate browser-compatible compressed motion derivative
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          ffmpeg -y -hide_banner -loglevel error -i public/media/hero.mp4 -an -vf 'scale=1280:-2' -c:v libx264 -preset medium -crf 24 -pix_fmt yuv420p -movflags +faststart public/media/hero-optimized.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of json public/media/hero-optimized.mp4
          ls -lh public/media/hero.mp4 public/media/hero-optimized.mp4
      - name: Commit derivative without changing original film
        shell: bash
        run: |
          git config user.name 'komplyint-delivery[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/media/hero-optimized.mp4
          if ! git diff --cached --quiet; then git commit -m 'asset(film): add optimized 720p web derivative from protected original'; git push origin HEAD:feature/handbook-quiet-precision-20261025; fi
